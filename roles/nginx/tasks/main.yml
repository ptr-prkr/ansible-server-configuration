---
- name: Ensure Nginx is installed
  ansible.builtin.apt:
    name: nginx
    state: present
  become: true

- name: Ensure Nginx service is running and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true

- name: Create Ansible managed web root
  ansible.builtin.file:
    path: "{{ nginx_document_root }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Deploy Ansible managed web page
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_document_root }}/index.html"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Deploy Ansible managed Nginx configuration
  ansible.builtin.template:
    src: ansible-managed.conf.j2
    dest: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: Reload nginx

- name: Enable Ansible managed Nginx site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ nginx_site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ nginx_site_name }}"
    state: link
  become: true
  notify: Reload nginx
